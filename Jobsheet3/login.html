<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Officer Sign In</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Jobsheet 3 part II exercise 6.4 no. 4: static version of the Login wireframe in docs/wireframe.md.
         The wireframe only shows the app name at the top, so this header has no navigation menu. -->
    <header>
        <h1>SIMPUS-Mini</h1>
    </header>

    <main>
        <section>
            <h2>Officer Sign In</h2>
            <!-- No action yet: like the Add Book form in jobsheet-01, nothing is processed. -->
            <form>
                <p>
                    <label for="username">Username</label><br>
                    <input type="text" id="username" name="username" required>
                </p>
                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" required>
                </p>
                <p>
                    <button type="submit">Sign In</button>
                </p>
            </form>
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3</p>
    </footer>
</body>
</html>
